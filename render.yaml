# Render.com Blueprint Specification
# Deploy with 1-click on Render: https://render.com
# Blueprint Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bubble-up-laundry-system
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
